name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install project generator
        run: brew install xcodegen
      - name: Unit and UI tests
        run: bash scripts/test.sh
      - name: Compile Release for devices
        run: >-
          xcodebuild build -project ForeignLanguageLearner.xcodeproj
          -scheme ForeignLanguageLearner -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
