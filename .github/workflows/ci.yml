name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alignment-backend:
    name: Alignment backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/alignment/package-lock.json
      - name: Python contracts and existing aligner regression suite
        run: |
          python -m unittest discover -s backend -p 'test_*.py' -v
          python -m unittest discover -s tools/subtitle-aligner -p 'test_*.py' -v
          python -m compileall -q backend tools/subtitle-aligner/worker
      - name: CDK type and infrastructure assertions
        working-directory: infra/alignment
        run: npm ci && npm test
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install project generator
        run: brew install xcodegen
      - name: Unit and UI tests
        run: bash scripts/test.sh
      - name: Compile Release for devices
        run: >-
          xcodebuild build -project ForeignLanguageLearner.xcodeproj
          -scheme ForeignLanguageLearner -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
