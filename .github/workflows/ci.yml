name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # PR updates supersede old checks; every main push must finish before its verified tag.
  group: ios-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Select UI coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_ui: ${{ steps.scope.outputs.run_ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check iOS inputs in the PR merge-base diff
        id: scope
        run: python3 scripts/ci_changes.py
  alignment-backend:
    name: Cloud backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/alignment/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install billing verification test dependencies
        run: |
          python -m pip install --require-hashes -r backend/billing/requirements.lock
          python -m pip install -r backend/billing/requirements-dev.txt
      - name: Python contracts and existing aligner regression suite
        run: |
          PYTHON=python bash scripts/test-cloud-contracts.sh
          python -m unittest discover -s tools/subtitle-aligner -p 'test_*.py' -v
          python -m unittest tools.cloud_control.test_control -v
          python -m unittest discover -s Tests/CI -p 'test_*.py' -v
          python -m compileall -q backend tools/subtitle-aligner/worker tools/cloud_control
          node --check tools/cloud_control/web/app.js
          bash -n scripts/cloud-control.sh scripts/tag-verified-main.sh
      - name: CDK type and infrastructure assertions
        working-directory: infra/alignment
        run: npm ci && npm test
  ios-build:
    name: Build iOS test products
    needs: changes
    runs-on: macos-26-intel
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install project generator
        run: brew install xcodegen
      - name: Compile XCTest products once
        run: python3 scripts/ci_ios.py compile
      - name: Boot isolated simulators and enumerate all tests
        id: plan
        env:
          RUN_UI_TESTS: ${{ needs.changes.outputs.run_ui }}
        run: |
          if [[ "$RUN_UI_TESTS" == "true" ]]; then
            python3 scripts/ci_ios.py plan
          else
            python3 scripts/ci_ios.py plan --unit-only
          fi
      - name: Archive portable test products
        run: python3 scripts/ci_ios.py pack
      - name: Share portable test products
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-products
          path: build/ios-test-products.tar.gz
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Save frozen test plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-plan-${{ github.run_attempt }}
          path: |
            build/test-enumeration*.json
            build/test-shards.json
            build/Enumeration-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
  ios-tests:
    name: iOS tests (${{ matrix.shard }})
    needs: ios-build
    # Standard Intel runners provide 14 GB RAM for XCTest (arm64 standard has 7 GB).
    runs-on: macos-26-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ios-build.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios-test-products
          path: build
      - name: Restore products with executable permissions
        run: mkdir -p build/ci-testing && tar -xzf build/ios-test-products.tar.gz -C build/ci-testing
      - name: Run frozen test shard without rebuilding
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci_ios.py run --shard "$TEST_SHARD"
      - name: Save shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            build/*.xcresult
            build/summary-*.json
            build/ci-testing/test-shards.json
          if-no-files-found: ignore
          retention-days: 14
  ios-release:
    name: Compile iOS device Release
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: bash scripts/bootstrap.sh
      - name: Compile Release for devices
        run: >-
          xcodebuild build -project ForeignLanguageLearner.xcodeproj
          -scheme ForeignLanguageLearner -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-logs-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Build
          if-no-files-found: ignore
          retention-days: 14
  test:
    # Require every selected shard; only PRs into main touching iOS inputs include UI.
    name: Build and test
    if: always()
    needs: [ios-build, ios-tests, ios-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require every iOS build and shard to pass
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CI_JOB_RESULTS'])
          for name, value in results.items():
              print(name, value['result'])
          assert all(v['result'] == 'success' for v in results.values()), 'An iOS build or test shard did not pass'
          PY
