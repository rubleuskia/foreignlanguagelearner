name: FoundationModelsFeasibilityProbe
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 'P2HAB4L7VL'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  FoundationModelsFeasibilityProbe:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubleuskia.foreignlanguagelearner.foundation-models-probe
        PRODUCT_NAME: Foundation Models Probe
        INFOPLIST_KEY_CFBundleDisplayName: FM Feasibility Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ProbePromptVersion: context-analysis-v1
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  FoundationModelsFeasibilityProbe:
    build:
      targets:
        FoundationModelsFeasibilityProbe: all
    archive:
      config: Debug
