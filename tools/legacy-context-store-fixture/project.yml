name: LegacyContextStoreGenerator
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  LegacyContextStoreGenerator:
    type: tool
    platform: macOS
    sources:
      - path: LegacyLibraryModels.swift
      - path: LegacyPolishTypes.swift
      - path: GenerateLegacyContextStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubleuskia.foreignlanguagelearner.legacy-store-generator
        PRODUCT_MODULE_NAME: ForeignLanguageLearner
schemes:
  LegacyContextStoreGenerator:
    build:
      targets:
        LegacyContextStoreGenerator: all
