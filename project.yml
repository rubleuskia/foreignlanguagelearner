name: ForeignLanguageLearner
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 'P2HAB4L7VL'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  ForeignLanguageLearner:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources]
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubleuskia.foreignlanguagelearner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Language Learner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ForeignLanguageLearnerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: ForeignLanguageLearner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubleuskia.foreignlanguagelearner.tests
  ForeignLanguageLearnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: ForeignLanguageLearner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubleuskia.foreignlanguagelearner.uitests
schemes:
  ForeignLanguageLearner:
    build:
      targets:
        ForeignLanguageLearner: all
    test:
      gatherCoverageData: true
      targets:
        - ForeignLanguageLearnerTests
        - ForeignLanguageLearnerUITests
    archive:
      config: Release
